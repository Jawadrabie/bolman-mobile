name: bolman_mobile
publish_to: none
description: Bolman mobile app - passenger and driver.
version: 2.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  supabase_flutter: ^2.8.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  go_router: ^14.2.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  intl: ^0.20.2
  collection: ^1.18.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.2.1
  shared_preferences: ^2.5.3
  lottie: ^3.3.1
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#6C63FF"
    theme_color: "#6C63FF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
